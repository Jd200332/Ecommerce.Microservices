name: Build and Deploy Microservices

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 1. Restore the solution so internal project references map correctly
      - name: Restore NuGet Packages
        run: dotnet restore Ecommerce.Microservices.sln

      # 2. Build the solution cleanly
      - name: Build Solution
        run: dotnet build Ecommerce.Microservices.sln --no-restore --configuration Release

      # 3. Docker Login & Pushes (Your existing working CI blocks)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Product Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Services/Product.Service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/productservice:latest

      - name: Build and Push Cart Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Services/Cart.Service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cartservice:latest

  deploy-product:
    runs-on: ubuntu-latest
    needs: build-and-push # Waits for the Docker images to successfully push
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Deploy ProductService
        run: |
          az webapp config container set \
            --name ecommerceclone \
            --resource-group ecommerce-microservices \
            --container-image-name ${{ secrets.DOCKER_USERNAME }}/productservice:latest \
            --container-registry-url https://index.docker.io
          
          az webapp config appsettings set \
            --name ecommerceclone \
            --resource-group ecommerce-microservices \
            --settings ASPNETCORE_ENVIRONMENT=Production
          
          az webapp restart --name ecommerceclone --resource-group ecommerce-microservices

  deploy-cart:
    runs-on: ubuntu-latest
    needs: deploy-product # Sequential deployment prevents hitting simultaneous locks
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Deploy CartService
        run: |
          az webapp config container set \
            --name ecommercecart \
            --resource-group ecommerce-microservices \
            --container-image-name ${{ secrets.DOCKER_USERNAME }}/cartservice:latest \
            --container-registry-url https://index.docker.io
          
          az webapp config appsettings set \
            --name ecommercecart \
            --resource-group ecommerce-microservices \
            --settings ASPNETCORE_ENVIRONMENT=Production
          
          az webapp restart --name ecommercecart --resource-group ecommerce-microservices