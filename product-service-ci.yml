name: Services CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "master" ]
  workflow_dispatch: # 🎯 Allows manual triggers

jobs:
  build-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push ProductService Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Services/Product.Service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/productservice:latest

  build-cart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push CartService Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Services/Cart.Service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cartservice:latest