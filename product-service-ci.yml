name: Services CI

on:
  push:
    branches: [ "master" ]
  workflow_dispatch: # 🎯 This forces a manual "Run workflow" button to appear

jobs:
  build-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Run tests
        run: dotnet test ./src/Services/ProductService/ProductService.Tests.csproj
      - name: Build and Push ProductService Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Services/ProductService/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/productservice:latest

  build-cart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Run tests
        run: dotnet test ./src/Services/CartService/CartService.Tests.csproj
      - name: Build and Push CartService Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Services/CartService/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cartservice:latest